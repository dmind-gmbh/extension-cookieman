---
paths:
  - Build/
  - Configuration/
excludePatterns:
  - "*/node_modules/*"
filePatterns:
  - '*.typoscript'
  - '*.tsconfig'
  - ext_typoscript_*.*
sniffs:
  - class: Indentation
    parameters:
      indentConditions: true
      indentPerLevel: 4
      useSpaces: true
  - class: DeadCode
    disabled: true
  - class: OperatorWhitespace
  - class: RepeatingRValue
    disabled: true
  - class: DuplicateAssignment
  - class: EmptySection
    disabled: true
  - class: NestingConsistency
    parameters:
      commonPathPrefixThreshold: 1
