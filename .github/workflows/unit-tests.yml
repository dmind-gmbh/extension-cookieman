name: CGL & unit tests

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
      - '!l10n_*'
  pull_request:
    branches:
      - '**'
      - '!l10n_*'

jobs:
  js-assets:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - id: nodejs-version
        run: echo "version=$(grep --only-matching --perl-regexp '^nodejs_version:\s*"\K[^"]+' .ddev/config.yaml)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nodejs-version.outputs.version }}
          cache: yarn
          cache-dependency-path: Build/yarn.lock
      - run: yarn --cwd=Build/ install --frozen-lockfile
      - run: yarn --cwd=Build/ run lint
      - run: yarn --cwd=Build/ run build
      - name: Verify committed build output is up to date
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Build output differs from what's committed. Run 'yarn --cwd=Build/ run build' locally and commit the result." >&2
            git status --short
            git diff
            exit 1
          fi
  unit-tests:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        php-version: [ "8.2", "8.3", "8.4", "8.5" ]
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: intl, mbstring, json, zip, curl
          tools: composer:v2
      - run: composer update --no-interaction --no-progress
      - run: composer show
      - run: composer tests-for:ci
  unit-tests-lowest:
    runs-on: ubuntu-24.04
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        php-version: [ "8.2", "8.3" ]
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: intl, mbstring, json, zip, curl
          tools: composer:v2
      - run: composer update --no-interaction --prefer-lowest --no-progress
      - run: composer show
      - run: composer tests-for:ci
